# The configuration of a MUP server. Replace the example addresses.
server:
  # The UDP ports and the ICMP Echo identifiers that the server accepts, as one
  # port or a range such as 5000-6000. Each route of a client names one of them.
  port: 5000
  # The WireGuard target that receives all traffic.
  target: 198.51.100.7:51820
