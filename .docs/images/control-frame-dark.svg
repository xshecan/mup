<svg xmlns="http://www.w3.org/2000/svg" width="800" height="472" viewBox="0 0 800 472" role="img" aria-labelledby="title desc" xml:space="preserve">
<title id="title">Control frame</title>
<desc id="desc">The 48-byte control frame in rows of four bytes: magic, version, type, transport, flags, length, status, path ID, listen port, server port, advertised IP, return IP, instance nonce, sequence, and lease seconds.</desc>
<style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;white-space:pre}</style>
<text class="m" x="149" y="16" font-size="14" font-weight="400" fill="#7a8296" text-anchor="middle">0</text>
<text class="m" x="335" y="16" font-size="14" font-weight="400" fill="#7a8296" text-anchor="middle">1</text>
<text class="m" x="521" y="16" font-size="14" font-weight="400" fill="#7a8296" text-anchor="middle">2</text>
<text class="m" x="707" y="16" font-size="14" font-weight="400" fill="#7a8296" text-anchor="middle">3</text>
<text class="m" x="40" y="51" font-size="14" font-weight="400" fill="#7a8296" text-anchor="end">0</text>
<text class="m" x="40" y="87" font-size="14" font-weight="400" fill="#7a8296" text-anchor="end">4</text>
<text class="m" x="40" y="123" font-size="14" font-weight="400" fill="#7a8296" text-anchor="end">8</text>
<text class="m" x="40" y="159" font-size="14" font-weight="400" fill="#7a8296" text-anchor="end">12</text>
<text class="m" x="40" y="195" font-size="14" font-weight="400" fill="#7a8296" text-anchor="end">16</text>
<text class="m" x="40" y="231" font-size="14" font-weight="400" fill="#7a8296" text-anchor="end">20</text>
<text class="m" x="40" y="267" font-size="14" font-weight="400" fill="#7a8296" text-anchor="end">24</text>
<text class="m" x="40" y="303" font-size="14" font-weight="400" fill="#7a8296" text-anchor="end">28</text>
<text class="m" x="40" y="339" font-size="14" font-weight="400" fill="#7a8296" text-anchor="end">32</text>
<text class="m" x="40" y="375" font-size="14" font-weight="400" fill="#7a8296" text-anchor="end">36</text>
<text class="m" x="40" y="411" font-size="14" font-weight="400" fill="#7a8296" text-anchor="end">40</text>
<text class="m" x="40" y="447" font-size="14" font-weight="400" fill="#7a8296" text-anchor="end">44</text>
<rect x="56" y="28" width="744" height="36" rx="0" fill="none" stroke="#2a2f3a" stroke-width="1"/>
<text x="428" y="51" font-size="14" text-anchor="middle"><tspan class="s" fill="#eef0f5" font-weight="400">magic</tspan><tspan class="m" fill="#7a8296" font-weight="400">   MUPC</tspan></text>
<rect x="56" y="64" width="186" height="36" rx="0" fill="none" stroke="#2a2f3a" stroke-width="1"/>
<text x="149" y="87" font-size="14" text-anchor="middle"><tspan class="s" fill="#eef0f5" font-weight="400">version</tspan><tspan class="m" fill="#7a8296" font-weight="400">   1</tspan></text>
<rect x="242" y="64" width="186" height="36" rx="0" fill="none" stroke="#2a2f3a" stroke-width="1"/>
<text x="335" y="87" font-size="14" text-anchor="middle"><tspan class="s" fill="#eef0f5" font-weight="400">type</tspan></text>
<rect x="428" y="64" width="186" height="36" rx="0" fill="none" stroke="#2a2f3a" stroke-width="1"/>
<text x="521" y="87" font-size="14" text-anchor="middle"><tspan class="s" fill="#eef0f5" font-weight="400">transport</tspan><tspan class="m" fill="#7a8296" font-weight="400">   0 or 1</tspan></text>
<rect x="614" y="64" width="186" height="36" rx="0" fill="none" stroke="#2a2f3a" stroke-width="1"/>
<text x="707" y="87" font-size="14" text-anchor="middle"><tspan class="s" fill="#eef0f5" font-weight="400">flags</tspan></text>
<rect x="56" y="100" width="372" height="36" rx="0" fill="none" stroke="#2a2f3a" stroke-width="1"/>
<text x="242" y="123" font-size="14" text-anchor="middle"><tspan class="s" fill="#eef0f5" font-weight="400">length</tspan><tspan class="m" fill="#7a8296" font-weight="400">   48</tspan></text>
<rect x="428" y="100" width="372" height="36" rx="0" fill="none" stroke="#2a2f3a" stroke-width="1"/>
<text x="614" y="123" font-size="14" text-anchor="middle"><tspan class="s" fill="#eef0f5" font-weight="400">status</tspan></text>
<rect x="56" y="136" width="372" height="36" rx="0" fill="none" stroke="#2a2f3a" stroke-width="1"/>
<text x="242" y="159" font-size="14" text-anchor="middle"><tspan class="s" fill="#eef0f5" font-weight="400">path ID</tspan><tspan class="m" fill="#7a8296" font-weight="400">   0 to 7</tspan></text>
<rect x="428" y="136" width="372" height="36" rx="0" fill="none" stroke="#2a2f3a" stroke-width="1"/>
<text x="614" y="159" font-size="14" text-anchor="middle"><tspan class="s" fill="#eef0f5" font-weight="400">listen port</tspan><tspan class="m" fill="#7a8296" font-weight="400">   client -p</tspan></text>
<rect x="56" y="172" width="372" height="36" rx="0" fill="none" stroke="#2a2f3a" stroke-width="1"/>
<text x="242" y="195" font-size="14" text-anchor="middle"><tspan class="s" fill="#eef0f5" font-weight="400">server port</tspan><tspan class="m" fill="#7a8296" font-weight="400">   server -p</tspan></text>
<rect x="428" y="172" width="372" height="36" rx="0" fill="none" stroke="#2a2f3a" stroke-width="1"/>
<text x="614" y="195" font-size="14" text-anchor="middle"><tspan class="s" fill="#7a8296" font-weight="400">reserved</tspan><tspan class="m" fill="#7a8296" font-weight="400">   zero</tspan></text>
<rect x="56" y="208" width="744" height="36" rx="0" fill="none" stroke="#2a2f3a" stroke-width="1"/>
<text x="428" y="231" font-size="14" text-anchor="middle"><tspan class="s" fill="#eef0f5" font-weight="400">advertised IP</tspan><tspan class="m" fill="#7a8296" font-weight="400">   client -s</tspan></text>
<rect x="56" y="244" width="744" height="36" rx="0" fill="none" stroke="#2a2f3a" stroke-width="1"/>
<text x="428" y="267" font-size="14" text-anchor="middle"><tspan class="s" fill="#eef0f5" font-weight="400">return IP</tspan><tspan class="m" fill="#7a8296" font-weight="400">   client -r, or zero</tspan></text>
<rect x="56" y="280" width="744" height="72" rx="0" fill="none" stroke="#2a2f3a" stroke-width="1"/>
<text x="428" y="321" font-size="14" text-anchor="middle"><tspan class="s" fill="#eef0f5" font-weight="400">instance nonce</tspan><tspan class="m" fill="#7a8296" font-weight="400">   nonzero, random</tspan></text>
<rect x="56" y="352" width="744" height="36" rx="0" fill="none" stroke="#2a2f3a" stroke-width="1"/>
<text x="428" y="375" font-size="14" text-anchor="middle"><tspan class="s" fill="#eef0f5" font-weight="400">sequence</tspan></text>
<rect x="56" y="388" width="744" height="36" rx="0" fill="none" stroke="#2a2f3a" stroke-width="1"/>
<text x="428" y="411" font-size="14" text-anchor="middle"><tspan class="s" fill="#eef0f5" font-weight="400">lease seconds</tspan><tspan class="m" fill="#7a8296" font-weight="400">   30</tspan></text>
<rect x="56" y="424" width="744" height="36" rx="0" fill="none" stroke="#2a2f3a" stroke-width="1"/>
<text x="428" y="447" font-size="14" text-anchor="middle"><tspan class="s" fill="#7a8296" font-weight="400">reserved</tspan><tspan class="m" fill="#7a8296" font-weight="400">   zero</tspan></text>
</svg>
