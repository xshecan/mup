<title id="title">One WireGuard packet before and after a MUP rewrite</title>
<desc id="desc">A hexdump of a 60-byte WireGuard keepalive from a peer, and the same packet on the wire after the MUP client rewrites it. Only the addresses, ports, checksums, and the three peer token bytes change.</desc>
