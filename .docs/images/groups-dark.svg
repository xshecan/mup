<svg xmlns="http://www.w3.org/2000/svg" width="800" height="272" viewBox="0 0 800 272" role="img" aria-labelledby="title desc" xml:space="preserve">
<title id="title">MUP path groups</title>
<desc id="desc">One MUP client has two path groups. Peers that send to listen port 51820 use two paths to two servers that forward to the first WireGuard target. A peer that sends to listen port 51821 uses one path to a third server that forwards to the second WireGuard target.</desc>
<style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;white-space:pre}</style>
<text class="s" x="0" y="65" font-size="14" font-weight="400" fill="#eef0f5" text-anchor="start">peer A</text>
<path d="M70 60 L106 60" fill="none" stroke="#a3a9b8" stroke-width="1.5"/>
<polygon points="112,60 104,56 104,64" fill="#a3a9b8"/>
<polygon points="64,60 72,64 72,56" fill="#a3a9b8"/>
<text class="s" x="0" y="113" font-size="14" font-weight="400" fill="#eef0f5" text-anchor="start">peer B</text>
<path d="M70 108 L106 108" fill="none" stroke="#a3a9b8" stroke-width="1.5"/>
<polygon points="112,108 104,104 104,112" fill="#a3a9b8"/>
<polygon points="64,108 72,112 72,104" fill="#a3a9b8"/>
<text class="s" x="0" y="187" font-size="14" font-weight="400" fill="#eef0f5" text-anchor="start">peer C</text>
<path d="M70 182 L106 182" fill="none" stroke="#a3a9b8" stroke-width="1.5"/>
<polygon points="112,182 104,178 104,186" fill="#a3a9b8"/>
<polygon points="64,182 72,186 72,178" fill="#a3a9b8"/>
<rect x="112" y="32" width="152" height="200" rx="8" fill="#161a22" stroke="#2a2f3a" stroke-width="1"/>
<path d="M112 138 L264 138" fill="none" stroke="#2a2f3a" stroke-width="1"/>
<text class="s" x="188" y="80" font-size="16" font-weight="500" fill="#eef0f5" text-anchor="middle">port 51820</text>
<text class="s" x="188" y="100" font-size="14" font-weight="400" fill="#a3a9b8" text-anchor="middle">fallback</text>
<text class="s" x="188" y="180" font-size="16" font-weight="500" fill="#eef0f5" text-anchor="middle">port 51821</text>
<text class="s" x="188" y="200" font-size="14" font-weight="400" fill="#a3a9b8" text-anchor="middle">burst</text>
<text class="m" x="356" y="52" font-size="14" font-weight="400" fill="#a3a9b8" text-anchor="middle">udp</text>
<path d="M270 60 L442 60" fill="none" stroke="#f0a742" stroke-width="2"/>
<polygon points="448,60 440,56 440,64" fill="#f0a742"/>
<polygon points="264,60 272,64 272,56" fill="#f0a742"/>
<rect x="448" y="40" width="120" height="40" rx="8" fill="#161a22" stroke="#2a2f3a" stroke-width="1"/>
<text class="s" x="508" y="65" font-size="14" font-weight="400" fill="#eef0f5" text-anchor="middle">server 1</text>
<path d="M574 60 L642 60" fill="none" stroke="#a3a9b8" stroke-width="1.5"/>
<polygon points="648,60 640,56 640,64" fill="#a3a9b8"/>
<polygon points="568,60 576,64 576,56" fill="#a3a9b8"/>
<text class="m" x="356" y="100" font-size="14" font-weight="400" fill="#a3a9b8" text-anchor="middle">icmp</text>
<path d="M270 108 L442 108" fill="none" stroke="#f0a742" stroke-width="2"/>
<polygon points="448,108 440,104 440,112" fill="#f0a742"/>
<polygon points="264,108 272,112 272,104" fill="#f0a742"/>
<rect x="448" y="88" width="120" height="40" rx="8" fill="#161a22" stroke="#2a2f3a" stroke-width="1"/>
<text class="s" x="508" y="113" font-size="14" font-weight="400" fill="#eef0f5" text-anchor="middle">server 2</text>
<path d="M574 108 L642 108" fill="none" stroke="#a3a9b8" stroke-width="1.5"/>
<polygon points="648,108 640,104 640,112" fill="#a3a9b8"/>
<polygon points="568,108 576,112 576,104" fill="#a3a9b8"/>
<text class="m" x="356" y="174" font-size="14" font-weight="400" fill="#a3a9b8" text-anchor="middle">udp</text>
<path d="M270 182 L442 182" fill="none" stroke="#f0a742" stroke-width="2"/>
<polygon points="448,182 440,178 440,186" fill="#f0a742"/>
<polygon points="264,182 272,186 272,178" fill="#f0a742"/>
<rect x="448" y="162" width="120" height="40" rx="8" fill="#161a22" stroke="#2a2f3a" stroke-width="1"/>
<text class="s" x="508" y="187" font-size="14" font-weight="400" fill="#eef0f5" text-anchor="middle">server 3</text>
<path d="M574 182 L642 182" fill="none" stroke="#a3a9b8" stroke-width="1.5"/>
<polygon points="648,182 640,178 640,186" fill="#a3a9b8"/>
<polygon points="568,182 576,186 576,178" fill="#a3a9b8"/>
<rect x="648" y="40" width="152" height="88" rx="8" fill="#161a22" stroke="#2a2f3a" stroke-width="1"/>
<text class="s" x="724" y="89" font-size="14" font-weight="400" fill="#eef0f5" text-anchor="middle">WireGuard target 1</text>
<rect x="648" y="162" width="152" height="40" rx="8" fill="#161a22" stroke="#2a2f3a" stroke-width="1"/>
<text class="s" x="724" y="187" font-size="14" font-weight="400" fill="#eef0f5" text-anchor="middle">WireGuard target 2</text>
<text class="s" x="0" y="260" font-size="14" font-weight="400" fill="#a3a9b8" text-anchor="start">The listen port selects the group of a peer. Amber lines carry a peer token.</text>
</svg>
