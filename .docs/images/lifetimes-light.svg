<svg xmlns="http://www.w3.org/2000/svg" width="800" height="148" viewBox="0 0 800 148" role="img" aria-labelledby="title desc" xml:space="preserve">
<title id="title">Lifecycle of tokens and ports</title>
<desc id="desc">A peer token or target port moves from the free queue to a route, then to quarantine, and then back to the free queue, unless a route owns it again.</desc>
<style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;white-space:pre}</style>
<rect x="0" y="12" width="184" height="72" rx="8" fill="#f5f7fa" stroke="#d9dde4" stroke-width="1"/>
<text class="s" x="92" y="44" font-size="16" font-weight="500" fill="#111827" text-anchor="middle">free queue</text>
<text class="s" x="92" y="66" font-size="14" font-weight="400" fill="#4b5565" text-anchor="middle">BPF queue map</text>
<rect x="308" y="12" width="184" height="72" rx="8" fill="#f5f7fa" stroke="#d9dde4" stroke-width="1"/>
<text class="s" x="400" y="44" font-size="16" font-weight="500" fill="#111827" text-anchor="middle">in use</text>
<text class="s" x="400" y="66" font-size="14" font-weight="400" fill="#4b5565" text-anchor="middle">two route entries</text>
<rect x="616" y="12" width="184" height="72" rx="8" fill="#f5f7fa" stroke="#d9dde4" stroke-width="1"/>
<text class="s" x="708" y="44" font-size="16" font-weight="500" fill="#111827" text-anchor="middle">quarantine</text>
<text class="s" x="708" y="66" font-size="14" font-weight="400" fill="#4b5565" text-anchor="middle">held by Go for 120 s</text>
<path d="M184 56 L302 56" fill="none" stroke="#4b5565" stroke-width="1.5"/>
<polygon points="308,56 300,52 300,60" fill="#4b5565"/>
<text class="s" x="246" y="46" font-size="14" font-weight="400" fill="#111827" text-anchor="middle">first packet</text>
<path d="M492 56 L610 56" fill="none" stroke="#4b5565" stroke-width="1.5"/>
<polygon points="616,56 608,52 608,60" fill="#4b5565"/>
<text class="s" x="554" y="28" font-size="14" font-weight="400" fill="#111827" text-anchor="middle">idle 180 s,</text>
<text class="s" x="554" y="46" font-size="14" font-weight="400" fill="#111827" text-anchor="middle">or client gone</text>
<path d="M708 84 L708 112 L92 112 L92 90" fill="none" stroke="#4b5565" stroke-width="1.5"/>
<polygon points="92,84 88,92 96,92" fill="#4b5565"/>
<text class="s" x="400" y="136" font-size="14" font-weight="400" fill="#4b5565" text-anchor="middle">Back to the queue, unless a route owns it again</text>
</svg>
