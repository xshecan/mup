<svg xmlns="http://www.w3.org/2000/svg" width="800" height="212" viewBox="0 0 800 212" role="img" aria-labelledby="title desc" xml:space="preserve">
<title id="title">MUP topology</title>
<desc id="desc">WireGuard peers send to a MUP client. The client sends each packet over one or more UDP or ICMP paths to a MUP server, which forwards it to one WireGuard target. The reserved WireGuard bytes hold a peer token only between the client and the server.</desc>
<style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;white-space:pre}</style>
<text class="m" x="104" y="16" font-size="14" font-weight="400" fill="#6b7487" text-anchor="middle">00 00 00</text>
<rect x="360" y="1" width="80" height="21" rx="4" fill="#fdf3e3"/>
<text class="m" x="400" y="16" font-size="14" font-weight="500" fill="#b45309" text-anchor="middle">00 00 11</text>
<text class="m" x="680" y="16" font-size="14" font-weight="400" fill="#6b7487" text-anchor="middle">00 00 00</text>
<text class="s" x="0" y="65" font-size="14" font-weight="400" fill="#111827" text-anchor="start">peer A</text>
<path d="M70 60 L138 60" fill="none" stroke="#4b5565" stroke-width="1.5"/>
<polygon points="144,60 136,56 136,64" fill="#4b5565"/>
<polygon points="64,60 72,64 72,56" fill="#4b5565"/>
<text class="s" x="0" y="105" font-size="14" font-weight="400" fill="#111827" text-anchor="start">peer B</text>
<path d="M70 100 L138 100" fill="none" stroke="#4b5565" stroke-width="1.5"/>
<polygon points="144,100 136,96 136,104" fill="#4b5565"/>
<polygon points="64,100 72,104 72,96" fill="#4b5565"/>
<text class="s" x="0" y="145" font-size="14" font-weight="400" fill="#111827" text-anchor="start">peer C</text>
<path d="M70 140 L138 140" fill="none" stroke="#4b5565" stroke-width="1.5"/>
<polygon points="144,140 136,136 136,144" fill="#4b5565"/>
<polygon points="64,140 72,144 72,136" fill="#4b5565"/>
<rect x="144" y="32" width="128" height="128" rx="8" fill="#f5f7fa" stroke="#d9dde4" stroke-width="1"/>
<text class="s" x="208" y="92" font-size="16" font-weight="500" fill="#111827" text-anchor="middle">MUP client</text>
<text class="s" x="208" y="112" font-size="14" font-weight="400" fill="#4b5565" text-anchor="middle">TCX program</text>
<rect x="528" y="32" width="128" height="128" rx="8" fill="#f5f7fa" stroke="#d9dde4" stroke-width="1"/>
<text class="s" x="592" y="92" font-size="16" font-weight="500" fill="#111827" text-anchor="middle">MUP server</text>
<text class="s" x="592" y="112" font-size="14" font-weight="400" fill="#4b5565" text-anchor="middle">TCX program</text>
<text class="m" x="400" y="52" font-size="14" font-weight="400" fill="#4b5565" text-anchor="middle">path 0, udp</text>
<path d="M278 60 L522 60" fill="none" stroke="#b45309" stroke-width="2"/>
<polygon points="528,60 520,56 520,64" fill="#b45309"/>
<polygon points="272,60 280,64 280,56" fill="#b45309"/>
<text class="m" x="400" y="92" font-size="14" font-weight="400" fill="#4b5565" text-anchor="middle">path 1, icmp</text>
<path d="M278 100 L522 100" fill="none" stroke="#b45309" stroke-width="2"/>
